<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NFC Boy">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>NFC Boy</title>
  <style>
    *{box-sizing:border-box}
    html,body,#game{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
    body{position:fixed;inset:0;font-family:system-ui,-apple-system,sans-serif}
    #boot{
      position:fixed;inset:0;z-index:999999;
      display:flex;align-items:center;justify-content:center;flex-direction:column;
      background:#000;color:#b7d58a;text-align:center;padding:24px;
    }
    #boot .logo{font:900 32px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.17em}
    #boot .msg{margin-top:18px;font-size:13px;opacity:.8}
    #boot .detail{margin-top:12px;font:11px/1.5 ui-monospace,monospace;opacity:.6;max-width:540px}
    #boot.error .logo{color:#ff8282}
    #offline{
      position:fixed;right:10px;top:max(10px,env(safe-area-inset-top));
      z-index:999998;background:#111c;color:#fff;padding:5px 8px;border-radius:20px;
      font-size:10px;display:none
    }
    #saveIcon{
      position:fixed;
      right:12px;
      bottom:max(12px,env(safe-area-inset-bottom));
      z-index:999997;
      width:22px;
      height:22px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#111a;
      border:1px solid #ffffff18;
      color:#b7d58a;
      font:700 12px/1 system-ui,-apple-system,sans-serif;
      opacity:0;
      transform:scale(.88);
      pointer-events:none;
      transition:opacity .18s ease, transform .18s ease;
      box-shadow:0 2px 8px #0005;
      backdrop-filter:blur(5px);
      -webkit-backdrop-filter:blur(5px);
    }
    #saveIcon.show{
      opacity:.72;
      transform:scale(1);
    }
  </style>
</head>
<body>
  <div id="boot">
    <div class="logo">NFC BOY</div>
    <div class="msg" id="bootMsg">Preparando el juego…</div>
    <div class="detail" id="bootDetail"></div>
  </div>
  <div id="offline">OFFLINE</div>
  <div id="saveIcon" aria-hidden="true">✓</div>
  <div id="game"></div>
  <script src="./app.js?v=41"></script>
</body>
</html>
